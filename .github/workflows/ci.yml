name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      # Keep imports fast: don't warm up the RAG stack during tests (the unit
      # suite tests pure logic and never touches chromadb / sentence-transformers).
      FINANCEAI_DISABLE_WARMUP: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        working-directory: app
        # The app's runtime deps MINUS the heavy RAG stack (chromadb,
        # sentence-transformers, torch), which the unit suite doesn't exercise.
        run: |
          python -m pip install --upgrade pip
          pip install pytest \
            google-adk google-genai mcp fastmcp \
            yfinance pandas numpy matplotlib \
            fastapi "uvicorn[standard]" pydantic python-dotenv PyYAML \
            PyJWT bcrypt

      - name: Run test suite
        working-directory: app
        run: pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Type-check and build
        working-directory: app/frontend
        # `npm run build` runs `tsc --noEmit` (type-check) then `vite build`.
        run: npm run build
